apply plugin: 'com.android.library'
apply plugin: 'maven-publish'
apply plugin: 'kotlin-android'
apply from: 'vendors.gradle'

android {
    namespace 'io.agora.beautyapi.bytedance'
    compileSdk 35

    defaultConfig {
        minSdkVersion 21
        targetSdk 34

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    implementation 'androidx.annotation:annotation:1.1.0'
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'
    if (new File("$AGORA_RTC_SDK").exists()) {
        api fileTree(dir: "${AGORA_RTC_SDK}", include: ['*.jar', '*.aar'])
    } else {
        api "$AGORA_RTC_SDK"
    }

    api project(':lib_bytedance_EffectAAR')
}

// Because the components are created only during the afterEvaluate phase, you must
// configure your publications using the afterEvaluate() lifecycle method.
afterEvaluate {
    publishing {
        publications {
            // Creates a Maven publication called "release".
            release(MavenPublication) {
                // Applies the component for the release build variant.
                from components.release

                // You can then customize attributes of the publication as shown below.
                groupId = 'com.github.AgoraIO-Community.BeautyAPI'
                artifactId = 'ByteDance'
                version = "$LIB_VERSION"
            }
            // Creates a Maven publication called “debug”.
            debug(MavenPublication) {
                // Applies the component for the debug build variant.
                from components.debug

                groupId = 'com.github.AgoraIO-Community.BeautyAPI'
                artifactId = 'ByteDance'
                version = "$LIB_VERSION"
            }
        }
        if(IS_PUBLISH_LOCAL){
            repositories {
                maven {
                    url = "file://${rootProject.projectDir.path}/maven"
                    println("maven publish to ${url}")
                }
            }
        }
    }
}